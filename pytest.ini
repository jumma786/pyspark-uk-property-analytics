[pytest]
testpaths = tests
# Without this, bare `pytest` puts tests/ on sys.path but not the repo root,
# so `from src...` fails; only `python -m pytest` (which adds CWD) works.
pythonpath = .
python_files = test_*.py
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
